   <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f0f1a; /* Dark background so the red/pink hearts pop */
            overflow: hidden; /* Prevents scrollbars from appearing as hearts fall */
            height: 100vh;
        }

        /* The style for each individual heart */
        .heart {
            position: absolute;
            top: -20px; /* Start just above the screen */
            font-size: 20px;
            color: #ff4d6d;
            user-select: none;
            pointer-events: none; /* Prevents the hearts from blocking clicks on the page */
            animation: fall linear forwards;
        }

        /* The falling animation */
        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                /* Moves the heart down past the bottom of the screen and spins it slightly */
                transform: translateY(105vh) rotate(350deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <script>
        // Array of different heart emojis/symbols for variety
        const heartStyles = ['❤️', '💖', '💗', '💓', '💝', '😍', '🥰', '😘' ,'👑', '💋', '🎉','🎈','🎊','🌺'];

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            
            // Randomly select a heart symbol
            heart.innerText = heartStyles[Math.floor(Math.random() * heartStyles.length)];
            
            // Randomize horizontal positioning across the screen (0% to 100%)
            heart.style.left = Math.random() * 100 + 'vw';
            
            // Randomize size (between 10px and 35px)
            heart.style.fontSize = Math.random() * 25 + 10 + 'px';
            
            // Randomize fall duration (between 3 and 6 seconds) for natural variation
            heart.style.animationDuration = Math.random() * 3 + 3 + 's';
            
            // Add it to the page
            document.body.appendChild(heart);
            
            // Automatically clean up and remove the heart element once its animation ends
            setTimeout(() => {
                heart.remove();
            }, 6000); // Matches the maximum animation duration
        }

        // Generate a new heart every 300 milliseconds
        setInterval(createHeart, 300);
    </script>

</body>

    <body>
    <div class="container">
        <h1>🎉 Ο χρόνος μας μαζί 💖</h1>
        <p class="start-date">Από τις <strong>22 Νοεμβρίου 2025</strong> όπου γνώρισα την <strong>γυναίκα της ζωής μου </strong> πέρασαν </p>

        <div class="units">
            <div class="unit"><div class="value" id="years">0</div><div class="label">ΧΡΟΝΙΑ</div></div>
            <div class="unit"><div class="value" id="months">0</div><div class="label">ΜΗΝΕΣ</div></div>
            <div class="unit"><div class="value" id="weeks">0</div><div class="label">ΕΒΔΟΜΑΔΕΣ</div></div>
            <div class="unit"><div class="value" id="days">0</div><div class="label">ΗΜΕΡΕΣ</div></div>
            <div class="unit"><div class="value" id="hours">0</div><div class="label">ΩΡΕΣ</div></div>
            <div class="unit"><div class="value" id="minutes">0</div><div class="label">ΛΕΠΤΑ</div></div>
            <div class="unit"><div class="value" id="seconds">0</div><div class="label">ΔΕΥΤΕΡΟΛΕΠΤΑ</div></div>
        </div>
    </div>

    <script>
        (function () {
            const START = new Date(2025, 10, 22); // month is 0-indexed, so 10 = November

            function isLeap(y) {
                return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
            }

            function daysInMonth(y, m) {
                return [31, isLeap(y) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m];
            }

            function tick() {
                const now = new Date();

                // ---- total days ----
                const diffMs = now - START;
                const totalDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
                document.getElementById('days').textContent = totalDays;

                // ---- calendar-aware difference ----
                let y = now.getFullYear() - START.getFullYear();
                let m = now.getMonth() - START.getMonth();
                let d = now.getDate() - START.getDate();

                if (d < 0) {
                    m--;
                    // days in previous month of START
                    const prevMonth = (now.getMonth() === 0 ? 11 : now.getMonth() - 1);
                    const prevYear = now.getMonth() === 0 ? now.getFullYear() - 1 : now.getFullYear();
                    d += daysInMonth(prevYear, prevMonth);
                }
                if (m < 0) {
                    y--;
                    m += 12;
                }

                const h = now.getHours() - 0;    // hours in day
                const min = now.getMinutes() - 0;
                const s = now.getSeconds() - 0;

                document.getElementById('years').textContent = y;
                document.getElementById('months').textContent = m;
                document.getElementById('weeks').textContent = Math.floor(totalDays / 7);
                document.getElementById('days').textContent = totalDays;
                document.getElementById('hours').textContent = h;
                document.getElementById('minutes').textContent = min;
                document.getElementById('seconds').textContent = s;
            }

            tick();
            setInterval(tick, 1000);
        })();
    </script>
